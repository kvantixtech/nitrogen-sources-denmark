name: flow
# Daily flow for every candidate station and the period (tools/flow.py). Open data, no secrets.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["tools/flow.py", ".github/workflows/flow.yml"]
permissions:
  contents: write
concurrency:
  group: flow
  cancel-in-progress: false
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p data/flow
          set -o pipefail
          python3 tools/flow.py 2>&1 | tee data/flow/run.log
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ && git commit -qm "Flow: daily discharge, coverage and the period (tools/flow.py), with run log" && git pull -q --rebase && git push -q
